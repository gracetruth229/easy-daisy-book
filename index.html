<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0052ff">
<title>㈜공간네트웍스 재무관리시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">

<style>
:root{
  --paper:#EDF3FC; --surface:#FFFFFF; --surface-2:#EAF2FF; --surface-3:#F5F9FF;
  --ink:#061B45; --ink-2:#34435A; --ink-3:#5F739A; --ink-4:#9DB0D0;
  --rule:#C9DAF2; --rule-soft:#E1EBFA;
  --accent:#0052FF; --accent-deep:#003FD1; --on-accent:#FFFFFF; --accent-soft:#E4EEFF;
  --navy:#061B45; --navy-2:#0B347D;
  --dr:#1D6BFF; --dr-soft:#E4EEFF;
  --cr:#C0442E; --cr-soft:#FBEAE6;
  --warn:#8A5A12; --warn-soft:#FDF3E0;
  --crit:#B3261E; --crit-soft:#FCE9E7;
  --sh-1:0 1px 2px rgba(15,23,42,.04), 0 8px 22px -10px rgba(15,64,150,.18);
  --sh-2:0 14px 34px rgba(15,23,42,.075);
  --sh-btn:0 8px 18px -6px rgba(0,82,255,.45);
  --r-card:18px; --r-btn:12px; --r-in:10px;
  --f-d:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-b:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-m:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#070D1A; --surface:#0F1830; --surface-2:#16223F; --surface-3:#0C1428;
    --ink:#E9EFFB; --ink-2:#AFC0DE; --ink-3:#7D91B8; --ink-4:#566A92;
    --rule:#22314F; --rule-soft:#1A2740;
    --accent:#5B8CFF; --accent-deep:#A9C4FF; --on-accent:#070D1A; --accent-soft:#16264A;
    --navy:#C9DAF2; --navy-2:#5B8CFF;
    --dr:#7FA8FF; --dr-soft:#152340;
    --cr:#E68A70; --cr-soft:#331D18;
    --warn:#D9A44E; --warn-soft:#2C2415;
    --crit:#E4796B; --crit-soft:#331B19;
    --sh-1:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -10px rgba(0,0,0,.7);
    --sh-2:0 14px 34px rgba(0,0,0,.55);
    --sh-btn:0 8px 18px -6px rgba(91,140,255,.4);
    --r-card:18px; --r-btn:12px; --r-in:10px;
}}

:root[data-theme="dark"]{
  --paper:#070D1A; --surface:#0F1830; --surface-2:#16223F; --surface-3:#0C1428;
  --ink:#E9EFFB; --ink-2:#AFC0DE; --ink-3:#7D91B8; --ink-4:#566A92;
  --rule:#22314F; --rule-soft:#1A2740;
  --accent:#5B8CFF; --accent-deep:#A9C4FF; --on-accent:#070D1A; --accent-soft:#16264A;
  --navy:#C9DAF2; --navy-2:#5B8CFF;
  --dr:#7FA8FF; --dr-soft:#152340;
  --cr:#E68A70; --cr-soft:#331D18;
  --warn:#D9A44E; --warn-soft:#2C2415;
  --crit:#E4796B; --crit-soft:#331B19;
  --sh-1:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -10px rgba(0,0,0,.7);
  --sh-2:0 14px 34px rgba(0,0,0,.55);
  --sh-btn:0 8px 18px -6px rgba(91,140,255,.4);
  --r-card:18px; --r-btn:12px; --r-in:10px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.m{font-family:var(--f-m);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:0 9px;height:32px;min-width:0;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
input[type=number]{text-align:right;font-family:var(--f-m);font-weight:600;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

/* shell */
#app{display:flex;height:100vh;min-height:560px;}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:18px 0 12px;}
.wm{font-family:var(--f-d);font-weight:700;font-size:19.5px;padding:0 18px 5px;letter-spacing:-.035em;color:var(--ink);line-height:1.25;}
.wm small{display:block;font-size:12.5px;font-weight:500;letter-spacing:-.01em;color:var(--accent);margin-bottom:1px;}
.co{padding:0 18px 14px;font-size:13px;color:var(--ink-3);}
.per{margin:0 12px 14px;}
.per label{display:block;font-size:11.5px;font-family:var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.per select{width:100%;height:36px;font-size:14.5px;}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px;}
.nav button{display:flex;align-items:center;gap:10px;padding:9.5px 11px;border:0;border-radius:6px;background:none;font-size:15px;color:var(--ink-2);font-weight:500;text-align:left;cursor:pointer;width:100%;}
.nav button:hover{background:var(--surface-2);}
.nav button.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600;}
.nav svg{flex:none;opacity:.75;}
.nav button.on svg{opacity:1;}
.nav .ct{margin-left:auto;font-family:var(--f-m);font-size:11.5px;padding:0 6px;color:var(--ink-3);}
.sfoot{margin-top:auto;padding:13px 18px 0;border-top:1px solid var(--rule-soft);font-size:12.5px;color:var(--ink-3);line-height:1.55;}
.sfoot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-4);margin-right:5px;vertical-align:1px;}
.sfoot .dot.ok{background:var(--accent);}
.sfoot .dot.bad{background:var(--crit);}
.brandmark{display:flex;align-items:center;gap:7px;padding:11px 18px 0;color:var(--accent);}
.brandmark svg{width:20px;height:20px;flex:none;opacity:.9;}
.brandmark span{font-family:var(--f-m);font-size:12.5px;letter-spacing:.06em;font-weight:500;
  color:var(--ink-4);white-space:nowrap;text-transform:none;}
.brandmark span b{font-weight:700;color:var(--accent);opacity:.95;}
.brandmark span i{font-style:normal;font-weight:600;color:var(--ink-2);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.tb{flex:none;min-height:56px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 22px;flex-wrap:wrap;}
.tb h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.tb .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.tbr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.body{flex:1;overflow:auto;padding:18px 22px 40px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.pri:hover{filter:brightness(1.08);}
.btn.pri:disabled{opacity:.42;cursor:not-allowed;filter:none;}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;}
.btn.danger{color:var(--crit);border-color:var(--rule);}
.btn.danger:hover{background:var(--crit-soft);}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;}
.seg button{height:30px;padding:0 11px;border:0;background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}
.seg button+button{border-left:1px solid var(--rule);}
.lnk{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--accent-deep);
  cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2.5px;
  text-decoration-color:var(--rule);}
.lnk:hover{text-decoration-color:var(--accent);}
.rcsum{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--rule-soft);}
.rcsum div{flex:1 1 150px;padding:11px 15px;border-right:1px solid var(--rule-soft);}
.rcsum div:last-child{border-right:0;}
.rcsum dt{font-size:11.5px;color:var(--ink-3);margin:0 0 3px;}
.rcsum dd{margin:0;font-family:var(--f-m);font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.rcsum dd.neg{color:var(--cr);}
.rcsum dd.ok{color:var(--accent-deep);}
.scrollbox{max-height:420px;overflow-y:auto;}
.ch .lb2{font-size:11.5px;color:var(--ink-3);font-weight:500;}
select.mini{height:28px;padding:0 8px;border:1px solid var(--rule);border-radius:7px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:600;}
.rcgrid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:13px 15px;}
.rcgrid .f{display:flex;flex-direction:column;gap:5px;}
.rcgrid .f label{font-size:11.5px;color:var(--ink-3);font-weight:500;}
.rcgrid input,.rcgrid select{height:34px;padding:0 10px;border:1px solid var(--rule);
  border-radius:var(--r-in);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-in);padding:9px 11px;width:100%;}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,82,255,.14);}
.rcgrid input.num{font-family:var(--f-m);text-align:right;font-variant-numeric:tabular-nums;width:170px;}
.ldbar{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap;}
.ldbar .sp{flex:1;}
.ldbar .cntx{font-size:12.5px;color:var(--ink-3);font-family:var(--f-m);white-space:nowrap;}
.ldbar .seg button{display:inline-flex;align-items:center;gap:6px;}
.ldbar .seg button .c{font-family:var(--f-m);font-size:10.5px;font-weight:700;
  background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;padding:0 6px;line-height:16px;}
.ldbar .seg button.on .c{background:rgba(255,255,255,.26);color:#fff;}
.srch{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink-3);min-width:232px;}
.srch svg{flex:none;}
.srch input{border:0;background:transparent;height:30px;padding:0;flex:1;min-width:0;font-size:13px;}
.srch input:focus{box-shadow:none;outline:none;}
.seg button.on{background:var(--accent);color:var(--on-accent);}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px;overflow:hidden;}
.card+.card{margin-top:16px;}
.ch{padding:10px 15px;border-bottom:1px solid var(--rule);background:var(--surface-3);font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.ch .r{display:flex;align-items:center;gap:8px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:var(--f-m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--surface-3);white-space:nowrap;position:sticky;top:0;z-index:1;}
td{padding:7px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
td.n,th.n{text-align:right;font-family:var(--f-m);white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
td.c{font-family:var(--f-m);font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
td.dr{color:var(--dr);font-weight:500;}
td.cr{color:var(--cr);font-weight:500;}
td.mut{color:var(--ink-3);}
.tw{overflow-x:auto;}
.zero{color:var(--ink-4);}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:0 7px;border-radius:4px;line-height:18px;white-space:nowrap;}
.tag.b{background:var(--surface-2);color:var(--ink-3);}
.tag.g{background:var(--accent-soft);color:var(--accent-deep);}
.tag.w{background:var(--warn-soft);color:var(--warn);}
.tag.c{background:var(--crit-soft);color:var(--crit);}
.tag.d{background:var(--dr-soft);color:var(--dr);}

/* entry */
.grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px;padding:14px 15px;}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;}
.f label{font-size:10.5px;color:var(--ink-3);font-weight:500;}
.f.s2{grid-column:span 2;} .f.s3{grid-column:span 3;} .f.s4{grid-column:span 4;}
.f.s5{grid-column:span 5;} .f.s6{grid-column:span 6;} .f.s12{grid-column:span 12;}
table.lines{min-width:880px;}
table.lines td{padding:5px 8px;}
table.lines th{padding:7px 8px;}
table.lines input,table.lines select{height:30px;width:100%;font-size:12.5px;}
table.lines td.act{width:34px;text-align:center;padding:5px 4px;}
.xbtn{width:24px;height:24px;border-radius:5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-3);cursor:pointer;display:inline-grid;place-items:center;}
.xbtn:hover{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-soft);}
.sumbar{display:flex;align-items:center;gap:16px;padding:11px 15px;border-top:1px solid var(--rule);background:var(--surface-3);flex-wrap:wrap;}
.sumbar .lb{font-size:11.5px;color:var(--ink-3);}
.sumbar .vl{font-family:var(--f-m);font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
.sumbar .diff.ok{color:var(--accent-deep);}
.sumbar .diff.bad{color:var(--crit);}
.sumbar .sp{flex:1;}

/* fs */
.fs2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
table.fs td{padding:5px 14px;border-bottom:1px solid var(--rule-soft);}
table.fs tr.grp td{background:var(--surface-3);font-weight:600;color:var(--ink-2);font-size:11.5px;padding:7px 14px;border-top:1px solid var(--rule-soft);}
table.fs tr.hd td{font-weight:600;}
table.fs tr.sub td:first-child{padding-left:30px;color:var(--ink-2);}
table.fs tr.tot td.n{font-weight:700;letter-spacing:-.015em;}
table.fs tr.tot td{border-top:1px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--surface-3);font-weight:600;padding-top:8px;padding-bottom:8px;}
table.fs.multi{min-width:100%;}
table.fs.multi th{font-size:10.5px;font-family:var(--f-m);letter-spacing:.06em;
  color:var(--accent-deep);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--rule);
  background:var(--surface-2);text-align:left;white-space:nowrap;}
table.fs.multi th.n{text-align:right;}
table.fs.multi th.sum,table.fs.multi td.sum{border-left:1px solid var(--rule);}
table.fs.multi td.n{width:112px;min-width:96px;}
table.fs.multi td.sum{font-weight:700;color:var(--accent-deep);background:var(--surface-3);}
table.fs.multi tr.zero td.sum{color:var(--ink-4);font-weight:400;}
table.fs.multi tr.tot td.sum{background:var(--accent-soft);}
table.fs.multi td:first-child{white-space:nowrap;}
.plw{overflow-x:auto;border:0;border-radius:0;background:transparent;}
table.fs.two th{font-size:10px;font-family:var(--f-m);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:7px 14px;border-bottom:1px solid var(--rule);
  background:var(--surface-3);text-align:left;}
table.fs.two th.n{text-align:right;}
table.fs.two td.n{width:118px;}
table.fs.two td.n:last-child{font-weight:600;color:var(--ink);}
table.fs.two tr.sub td.n:last-child{font-weight:500;}
table.fs.two tr.zero td.n:last-child{color:var(--ink-4);font-weight:400;}
table.fs td.n{width:140px;}
.neg{color:var(--cr);}
.chkbar{padding:10px 15px;border-top:1px solid var(--rule);background:var(--surface-3);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
.chkbar.ok{color:var(--accent-deep);}
.chkbar.bad{color:var(--crit);}
.chkbar .sp{flex:1;}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.7;}
.empty b{display:block;color:var(--ink-2);font-size:15px;font-weight:600;margin-bottom:5px;}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6;padding:11px 15px;border-top:1px solid var(--rule-soft);}
.banner{margin-bottom:16px;border-radius:8px;padding:12px 15px;font-size:13px;display:flex;gap:10px;align-items:flex-start;line-height:1.55;}
.banner.w{background:var(--warn-soft);color:var(--warn);}
.banner.c{background:var(--crit-soft);color:var(--crit);}
.banner b{font-weight:600;}
.banner svg{flex:none;margin-top:2px;}

.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:15px;}
.xc{border:1px solid var(--rule);border-radius:8px;padding:15px 16px;background:var(--surface);display:flex;flex-direction:column;gap:5px;}
.xc b{font-size:14px;font-weight:600;}
.xc span{font-size:12px;color:var(--ink-3);line-height:1.55;flex:1;}
.xc .btn{margin-top:9px;align-self:flex-start;}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 8px 26px -8px rgba(0,0,0,.45);z-index:99;opacity:0;pointer-events:none;transition:opacity .18s;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}

@media (max-width:900px){
  #app{flex-direction:column;height:auto;min-height:100vh;}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--rule);padding:12px 0 8px;}
  .wm,.co{padding-left:16px;padding-right:16px;}
  .nav{flex-direction:row;overflow-x:auto;padding:0 10px;}
  .nav button{white-space:nowrap;}
  .nav .ct{display:none;}
  .per{margin:10px 12px;}
  .sfoot{padding-top:10px;}
  .fs2{grid-template-columns:1fr;}
  .body{padding:14px 14px 40px;}
  .grid2 .f.s2,.grid2 .f.s3,.grid2 .f.s4{grid-column:span 6;}
}

/* ─────────── 공간복붙 톤 ─────────── */
body{background:var(--paper);}
.side{background:linear-gradient(180deg,var(--surface-3) 0%,var(--paper) 100%);border-right:1px solid var(--rule);}
.wm small{color:var(--accent);font-weight:700;}
.nav button{border-radius:11px;font-weight:600;letter-spacing:-.015em;}
.nav button:hover{background:var(--accent-soft);color:var(--accent-deep);}
.nav button.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-btn);}
.nav button.on svg{color:var(--on-accent);}
.nav .ct{background:rgba(255,255,255,.28);color:inherit;border-radius:999px;font-weight:700;}
.nav button:not(.on) .ct{background:var(--accent-soft);color:var(--accent-deep);}
.per select{border-radius:var(--r-in);border-color:var(--rule);background:var(--surface);font-weight:600;color:var(--ink);}
.sfoot{border-top:1px solid var(--rule);}

.tb{background:var(--surface);border-bottom:1px solid var(--rule);}
.tb h1{letter-spacing:-.03em;font-weight:700;}

.card{border:1px solid var(--rule);border-radius:var(--r-card);box-shadow:var(--sh-1);overflow:hidden;}
.ch{background:var(--surface-3);border-bottom:1px solid var(--rule);font-weight:700;letter-spacing:-.01em;color:var(--ink);}

.btn{border-radius:var(--r-btn);border-color:var(--rule);font-weight:700;letter-spacing:-.025em;color:var(--ink);}
.btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);}

/* ---------- 유틸 ---------- */
function $(s){ return document.querySelector(s); }
function el(t,a,kids){
  var e=document.createElement(t); a=a||{};
  for(var k in a){
    if(k==="class") e.className=a[k];
    else if(k==="html") e.innerHTML=a[k];
    else if(k==="text") e.textContent=a[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null && a[k]!==undefined) e.setAttribute(k,a[k]);
  }
  (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function svg(d,sz){
  return '<svg width="'+(sz||17)+'" height="'+(sz||17)+'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"></path></svg>';
}
function fmt(n){ n=Math.round(n||0); return n===0?"":n.toLocaleString("ko-KR"); }
function fmt0(n){ return Math.round(n||0).toLocaleString("ko-KR"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function catOf(code){
  var c=parseInt(code,10)||0;
  for(var i=0;i<CATS.length;i++){ if(c>=CATS[i].lo && c<=CATS[i].hi) return CATS[i]; }
  return {k:"A",name:"기타",dn:true};
}
function accName(code){
  for(var i=0;i<S.accounts.length;i++) if(S.accounts[i].code===code) return S.accounts[i].name;
  return "(미등록 " + code + ")";
}
function ym(d){ return (d||"").slice(0,7); }
function bizDigits(v){ return String(v||"").replace(/[^0-9]/g,""); }
function bizFormat(v){
  var d=bizDigits(v);
  if(d.length!==10) return String(v||"");
  return d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5);
}
function bizValid(v){
  var d=bizDigits(v);
  if(d.length!==10) return false;
  var w=[1,3,7,1,3,7,1,3,5], sum=0;
  for(var i=0;i<9;i++) sum += (+d[i])*w[i];
  sum += Math.floor((+d[8])*5/10);
  return ((10-(sum%10))%10) === (+d[9]);
}
function findPartner(name){
  var k=String(name||"").trim();
  if(!k) return null;
  for(var i=0;i<S.partners.length;i++) if(S.partners[i].name===k) return S.partners[i];
  return null;
}
function findProject(name){

  for(var i=0;i<S.projects.length;i++) if(S.projects[i].name===k) return S.projects[i];

}
function projectUsage(){
  var u={};
  S.vouchers.forEach(function(v){
    (v.lines||[]).forEach(function(l){
      var nm=String(l.project||"").trim(); if(!nm) return;
      if(!u[nm]) u[nm]={n:0, last:"", dr:0, cr:0, pl:0};
      u[nm].n++;
      if((v.date||"")>u[nm].last) u[nm].last=v.date||"";
      u[nm].dr+=(+l.dr||0); u[nm].cr+=(+l.cr||0);
      var c=parseInt(l.code,10);
      if(c>=4000000 && c<=9999999){
        var cat=catOf(l.code);
        u[nm].pl += cat.dn ? -((+l.dr||0)-(+l.cr||0)) : ((+l.cr||0)-(+l.dr||0));
      }
    });
  });
  return u;
}
function partnerUsage(){
  var u={};

      u[nm].n++;
      if((v.date||"")>u[nm].last) u[nm].last=v.date||"";
      if(!u[nm].bizno && l.bizno) u[nm].bizno=l.bizno;

function toast(msg){

function todayISO(){
  var d=new Date(), p=function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

/* 지운 전표는 S.trash 로 갈라 둔다 — S.vouchers 에는 살아 있는 것만 남는다 */
function sortTrash(){
  S.trash.sort(function(a,b){
    return String(b.deletedAt||"").localeCompare(String(a.deletedAt||""));
  });
}
function splitVouchers(all){
  var live=[], gone=[];
  (all||[]).forEach(function(v){ (v && v.deleted ? gone : live).push(v); });
  S.vouchers=live; S.trash=gone; sortTrash();
}
function allVouchers(){ return S.vouchers.concat(S.trash); }
/* 살아 있는 것과 뺀 것 중 알맞은 쪽에 넣는다 */
function putLocal(id, doc){
  var local=Object.assign({id:id}, doc);
  function drop(arr){ for(var i=arr.length-1;i>=0;i--) if(arr[i].id===id) arr.splice(i,1); }
  drop(S.vouchers); drop(S.trash);
  (local.deleted ? S.trash : S.vouchers).push(local);
  sortTrash();
  return local;
}

/* 기간 필터 */
function inPeriod(v){ return S.period==="all" || ym(v.date)===S.period; }
function upToPeriod(v){ return S.period==="all" || ym(v.date)<=S.period; }
function periodVouchers(){ return S.vouchers.filter(inPeriod); }
function months(){
  var set={}; S.vouchers.forEach(function(v){ if(v.date) set[ym(v.date)]=1; });
  return Object.keys(set).sort();
}
/* 손익계산서에 세울 월 목록 — 전표가 있는 달만, 선택한 기간까지 */
function plMonths(){
  return months().filter(function(m){ return S.period==="all" || m<=S.period; });
}
function monthLabel(m){
  var mm=parseInt(String(m).slice(5,7),10);
  return mm+"월";
}
function inMonth(m){
  return function(v){ return ym(v.date)===m; };
}

/* 계정별 집계 */
function tally(filter){
  var m={};
  S.vouchers.filter(filter).forEach(function(v){
    (v.lines||[]).forEach(function(l){
      if(!l.code) return;
      if(!m[l.code]) m[l.code]={code:l.code, dr:0, cr:0};
      m[l.code].dr += (+l.dr||0); m[l.code].cr += (+l.cr||0);
    });
  });
  return m;
}
function balOf(row){
  var c=catOf(row.code);
  return c.dn ? (row.dr-row.cr) : (row.cr-row.dr);
}
/* 손익: 누계/당월 */
function plTally(filter){ return tally(filter || upToPeriod); }
function sumRange(m, lo, hi){
  var t=0; for(var k in m){ var c=parseInt(k,10); if(c>=lo && c<=hi) t+=balOf(m[k]); } return t;
}
function netIncome(m){
  return sumRange(m,4000000,4499999) - sumRange(m,4500000,4999999)
       - sumRange(m,8000000,8999999)
       + sumRange(m,9000000,9309999) - sumRange(m,9310000,9999999);
}

/* 고치던 전표를 두고 나갈 때 — 덮어쓰기 사고를 막는다 */
function leaveEdit(next){

/* 손익 계정인가 — 매출·매출원가·판매관리비·영업외 */
function isPL(code){
  var c=parseInt(code,10);
  return (c>=4000000 && c<=4999999) || (c>=8000000 && c<=9999999);
}
function reverseVoucher(v){
  if(isClosed(todayISO())){
    alert("오늘이 든 "+monthName(ym(todayISO()))+"이 마감되어 있어 역분개 전표를 만들 수 없습니다." + "\n\n"
      + "재무제표 화면에서 그 달의 마감을 먼저 푸세요.");
    return;
  }
  var hasPL = (v.lines||[]).some(function(l){ return isPL(l.code); });
  var msg = "이 전표를 취소하는 역분개 전표를 만듭니다." + '\n\n' 
    + v.date + " · " + (v.memo||"(적요 없음)") + '\n'
    + fmt0(voucherAmount(v)) + "원" + '\n\n'
    + "원래 전표는 그대로 남고, 취소 전표가 하나 더 생깁니다." + "\n"
    + "자산·부채·자본 계정은 차변과 대변을 뒤집습니다." + "\n"
    + "손익 계정은 차대를 바꾸지 않고 같은 변에 마이너스로 넣습니다."
    + (hasPL ? ("\n\n" + "이 전표에는 손익 계정이 있어 마이너스로 들어갑니다.") : "");
  if(!confirm(msg)) return;
  var today = todayISO();
  var lines = (v.lines||[]).map(function(l){
    var dr=(+l.dr||0), cr=(+l.cr||0), nd, nc;
    if(isPL(l.code)){ nd = dr ? -dr : 0; nc = cr ? -cr : 0; }
    else { nd = cr; nc = dr; }
    return {code:l.code, name:l.name||accName(l.code), project:l.project||"",
            partner:l.partner||"", bizno:l.bizno||"",
            memo:"취소: " + (l.memo||v.memo||""), dr:nd, cr:nc};
  });
  var id = today.replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,8);
  persistVoucher(id, {date:today, type:v.type||"대체거래",
    memo:"취소: " + (v.memo||""), lines:lines, reverses:v.id,
    updatedAt:new Date().toISOString()});
  toast("역분개 전표를 만들었습니다");
  render();
}

function saveDraft(){
  var d=S.draft, t=draftTotals();
  var blk=draftBlocked();
  if(blk){ toast(blk); return; }
  if(Math.abs(t.diff)>=0.5){ toast("차변과 대변이 맞아야 저장됩니다"); return; }
  if(t.abs<0.5){ toast("금액이 들어간 줄이 없습니다"); return; }
  var lines=d.lines.filter(function(l){ return l.code && ((+l.dr||0)!==0 || (+l.cr||0)!==0); })
    .map(function(l){
      return {code:l.code, name:accName(l.code), project:(l.project||"").trim(),
              partner:l.partner||"", bizno:l.bizno||"",
              memo:l.memo||d.memo||"", dr:+l.dr||0, cr:+l.cr||0};
    });
  if(lines.length<2){ toast("계정과 금액이 있는 줄이 두 줄 이상이어야 합니다"); return; }
  var freshJ={};
  lines.forEach(function(l){
    var jn=String(l.project||"").trim();
    if(jn && !findProject(jn)) freshJ[jn]=1;
  });
  var freshJNames=Object.keys(freshJ);
  if(freshJNames.length && confirm("프로젝트 목록에 없는 이름이 있습니다.\n\n" + freshJNames.join(", ") + "\n\n프로젝트로 등록해 둘까요?")){
    freshJNames.forEach(function(nm){ S.projects.push({name:nm, memo:"전표에서 등록"}); });
    persistProjects();
  }
  var fresh={};
  lines.forEach(function(l){
    var nm=String(l.partner||"").trim();
    if(nm && !findPartner(nm)) fresh[nm]=bizDigits(l.bizno||"");
  });
  var freshNames=Object.keys(fresh);
  if(freshNames.length && confirm("거래처 목록에 없는 곳이 있습니다.\n\n" + freshNames.join(", ")
      + "\n\n거래처로 등록해 둘까요? (다음부터 자동으로 채워집니다)")){
    freshNames.forEach(function(nm){
      S.partners.push({name:nm, bizno:fresh[nm], kind:"매입처", memo:"전표에서 등록"});
    });
    persistPartners();
  }
  var id = S.editId || (d.date.replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,8));
  var doc = {date:d.date, type:d.type, memo:d.memo||"", lines:lines,
             updatedAt:new Date().toISOString(), unlocked:false};
  if(S.editId){
    var prev=null;
    S.vouchers.forEach(function(v){ if(v.id===S.editId) prev=v; });
    if(prev){
      if(prev.reverses) doc.reverses=prev.reverses;
      doc.editCount=(prev.editCount||0)+1;
      doc.lastEditedAt=new Date().toISOString();
      var why=prompt("무엇을 왜 고치셨나요? (전표에 남습니다)", prev.editNote||"");
      doc.editNote=(why===null?"":String(why).trim());
    }
  }
  persistVoucher(id, doc);
  var wasEdit=!!S.editId;
  S.lastType=d.type||S.lastType;
  S.editId=null; S.draft=newDraft();
  toast(wasEdit ? "고쳐서 저장하고 다시 잠갔습니다" : "전표를 저장했습니다");
  render();
}

function counterName(v, l){
  var mine=(+l.dr||0)-(+l.cr||0);
  var others=(v.lines||[]).filter(function(x){
    if(x===l) return false;
    var d=(+x.dr||0)-(+x.cr||0);
    return d!==0 && (d>0)!==(mine>0);
  });
  if(!others.length) others=(v.lines||[]).filter(function(x){ return x!==l; });
  if(!others.length) return "—";
  if(others.length===1) return others[0].name||accName(others[0].code);
  return "제좌";
}
function accountRows(code, filter, partner){
  var out=[];
  S.vouchers.filter(filter).forEach(function(v){
    (v.lines||[]).forEach(function(l, i){
      if(String(l.code)!==String(code)) return;
      if(partner){
        var p=String(l.partner||"").trim();
        if(partner==="__none__"){ if(p) return; }
        else if(p!==partner) return;
      }
      out.push({v:v, l:l, i:i});
    });
  });
  out.sort(function(a,b){
    return (a.v.date||"").localeCompare(b.v.date||"") || (a.v.id||"").localeCompare(b.v.id||"");
  });
  return out;
}

var NODEDUCT = [

function quarters(){

function qRange(key){

function noDeductHint(v){

  (v.lines||[]).forEach(function(l){

/* 장부에서 세금계산서 목록을 뽑는다
   발생 = 그 기간에 주고받은 세금계산서 (신고 대상)
   취소 = 역분개로 되돌린 것 (신고에서 차감)
   정리 = 지난 기수 납부·환급을 계정에서 털어낸 것 (신고와 무관) */
function bookTaxDocs(from, to){
  var va=vatAccounts(), sale=[], buy=[], isOut={}, isIn={};
  va.out.forEach(function(c){ isOut[c]=1; });
  va.inn.forEach(function(c){ isIn[c]=1; });
  function mk(v, l, amt, total, kind){
    var partner=l.partner||"", biz=l.bizno||"";
    (v.lines||[]).forEach(function(x){
      if(!partner && x.partner) partner=x.partner;
      if(!biz && x.bizno) biz=x.bizno;
    });
    return {key:v.id+"#"+l.code, date:v.date||"", memo:l.memo||v.memo||"",
            partner:partner, biz:bizDigits(biz), tax:amt, kind:kind,
            supply:Math.round((total-Math.abs(amt))*(amt<0?-1:1)),
            v:v, hint:noDeductHint(v)};
  }
  function classify(v, amt){
    if(amt>0) return "발생";
    return v.reverses ? "취소" : "정리";
  }
  S.vouchers.forEach(function(v){
    var d=String(v.date||"");
    if(d<from || d>to) return;
    var total=voucherAmount(v);
    (v.lines||[]).forEach(function(l){
      var dr=(+l.dr||0), cr=(+l.cr||0);
      if(isOut[l.code]){ var t1=cr-dr; if(t1) sale.push(mk(v,l,t1,total,classify(v,t1))); }
      else if(isIn[l.code]){ var t2=dr-cr; if(t2) buy.push(mk(v,l,t2,total,classify(v,t2))); }
    });
  });
  function bydate(a,b){ return String(a.date).localeCompare(String(b.date)); }
  sale.sort(bydate); buy.sort(bydate);
  return {sale:sale, buy:buy};
}

/* 홈택스에서 복사해 온 줄을 읽는다 — 날짜·사업자번호·금액만 찾는다 */
function parsePaste(text){
  var rows=[];
  String(text||"").split(/\r?\n/).forEach(function(ln){
    if(!ln.trim()) return;
    var cells = ln.indexOf("\t")>=0 ? ln.split("\t") : ln.split(",");
    if(cells.length<2) cells = ln.trim().split(/\s{2,}/);
    cells = cells.map(function(c){ return String(c).replace(/^"|"$/g,"").trim(); });
    var date="", biz="", name="", nums=[];
    cells.forEach(function(c){
      var bare=c.replace(/\s/g,"");
      var dg=bare.replace(/[^0-9]/g,"");
      if(!date && /^\d{4}[-./]?\d{2}[-./]?\d{2}$/.test(bare) && dg.length===8){
        date=dg.slice(0,4)+"-"+dg.slice(4,6)+"-"+dg.slice(6,8); return;
      }
      if(!biz && /^\d{3}-\d{2}-\d{5}$/.test(bare)){ biz=dg; return; }
      var n=bare.replace(/[,원]/g,"");
      if(/^-?\d+$/.test(n) && n.length<=11){
        if(!biz && n.length===10 && rows.length>=0 && /^\d{10}$/.test(n) && !date){ }
        nums.push(parseInt(n,10)); return;
      }
      if(!name && /[가-힣A-Za-z]/.test(c)) name=c;
    });
    if(!biz){
      cells.forEach(function(c){
        var bare=c.replace(/\s/g,"");
        if(!biz && /^\d{10}$/.test(bare) && bizValid(bare)) biz=bare;
      });
    }
    if(!date && !biz) return;
    var supply=0, tax=0;
    var pos=nums.filter(function(n){ return Math.abs(n)>=1; });
    if(pos.length>=2){ supply=pos[pos.length-2]; tax=pos[pos.length-1]; }
    else if(pos.length===1){ supply=pos[0]; tax=Math.round(pos[0]/10); }
    if(!supply && !tax) return;
    rows.push({date:date, biz:biz, name:name, supply:supply, tax:tax});
  });
  return rows;
}
function dayGap(a,b){
  if(!a || !b) return 0;
  var t1=Date.parse(a), t2=Date.parse(b);
  if(isNaN(t1) || isNaN(t2)) return 0;
  return Math.abs(t1-t2)/86400000;
}
function matchDocs(book, tax){
  var used={}, taken={}, ok=[], diff=[], onlyBook=[];
  function compat(b, h){
    if(b.biz && h.biz){ if(b.biz!==h.biz) return false; }
    else if(b.partner && h.name){ if(b.partner!==h.name) return false; }
    else return false;
    return dayGap(b.date, h.date)<=10;
  }
  /* 1차 — 세액까지 같은 짝을 먼저 붙인다 */
  book.forEach(function(b, bi){
    for(var i=0;i<tax.length;i++){
      if(used[i]) continue;
      if(!compat(b, tax[i])) continue;
      if(Math.abs((+tax[i].tax||0)-(+b.tax||0))>=1) continue;
      used[i]=1; taken[bi]=1; ok.push({b:b, h:tax[i]}); return;
    }
  });
  /* 2차 — 거래처와 날짜는 맞는데 세액이 다른 것 */
  book.forEach(function(b, bi){
    if(taken[bi]) return;
    for(var i=0;i<tax.length;i++){
      if(used[i]) continue;
      if(!compat(b, tax[i])) continue;
      used[i]=1; taken[bi]=1; diff.push({b:b, h:tax[i]}); return;
    }
    onlyBook.push(b);
  });
  var onlyTax=[];
  tax.forEach(function(h, i){ if(!used[i]) onlyTax.push(h); });
  return {ok:ok, diff:diff, onlyBook:onlyBook, onlyTax:onlyTax};
}

  if(!o.nod) o.nod={};
  if(!o.keep) o.keep={};
  if(!o.okd) o.okd={};

}

/* 회계기간 시작부터 오늘까지의 달 — 전표가 없는 달도 고를 수 있게 */
function bsMonths(){
  var set={};
  months().forEach(function(m){ set[m]=1; });
  var st=String(S.co.fyStart||"").slice(0,7), end=todayISO().slice(0,7);
  if(st){
    var y=parseInt(st.slice(0,4),10), mo=parseInt(st.slice(5,7),10);
    for(var i=0;i<120;i++){
      var mm=(mo+i-1)%12+1, yy=y+Math.floor((mo+i-1)/12);
      var k=yy+"-"+(mm<10?"0":"")+mm;
      set[k]=1;
      if(k>=end) break;
    }
  }
  return Object.keys(set).sort();
}
function asOfFilter(asOf){
  if(!asOf) return upToPeriod;
  return function(v){ return ym(v.date)<=asOf; };
}
function asOfLabel(asOf){
  if(!asOf) return (S.period==="all" ? "전체 기간 누계" : S.period+" 말 현재");
  return asOf+" 말 현재";
}
function buildBS(asOf){
  var m=tally(asOfFilter(asOf)), rows=[], tA=0, tL=0, tE=0;
  BSG.forEach(function(g){
    var items=S.accounts.filter(function(a){
      var c=parseInt(a.code,10); return c>=g.lo && c<=g.hi;
    }).map(function(a){
      return {code:a.code, name:a.name, bal: m[a.code] ? balOf(m[a.code]) : 0};
    });
    var sum=items.reduce(function(s,i){ return s+i.bal; },0);
    if(g.side==="A") tA+=sum; else if(g.side==="L") tL+=sum; else tE+=sum;
    rows.push({grp:g.t, side:g.side, sum:sum, items:items});
  });
  var ni=netIncome(m);
  tE += ni;
  return {rows:rows, tA:tA, tL:tL, tE:tE, ni:ni, diff:tA-(tL+tE)};
}
function buildPL(filter){
  var m=plTally(filter);
  var sales=sumRange(m,4000000,4499999), cogs=sumRange(m,4500000,4999999);
  var gross=sales-cogs;
  var sga=sumRange(m,8000000,8999999);
  var op=gross-sga;
  var ni_=sumRange(m,9000000,9309999), ne=sumRange(m,9310000,9999999);
  var pre=op+ni_-ne;
  function items(lo,hi){
    return S.accounts.filter(function(a){ var c=parseInt(a.code,10); return c>=lo&&c<=hi; })
      .map(function(a){ return {code:a.code, name:a.name, bal: m[a.code]?balOf(m[a.code]):0}; });
  }
  return {sales:sales, cogs:cogs, gross:gross, sga:sga, op:op, ni:ni_, ne:ne, pre:pre, net:pre,
    iSales:items(4000000,4499999), iCogs:items(4500000,4999999), iSga:items(8000000,8999999),
    iNi:items(9000000,9309999), iNe:items(9310000,9999999)};
}

  var msg = "「"+monthName(m)+"」을 마감합니다." + "\n\n"
    + "마감하면 이 달에는 전표를 새로 넣거나 고치거나 뺄 수 없습니다." + "\n"

function partnerForm(p, onSave){
  var name = prompt("거래처 이름", p ? p.name : "");

  if(!name){ toast("이름을 넣어 주세요"); return; }

  var kind = prompt("구분 — " + PKINDS.join(" / "), p ? (p.kind||"매입처") : "매입처");
  if(kind===null) return;
  kind = String(kind).trim() || "기타";

}

function csvOf(rows){
  return "﻿" + rows.map(function(r){
    return r.map(function(c){
      var s = c==null ? "" : String(c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }).join("\r\n");
}
function rowsVouchers(){
  var out=[["작성일","전표유형","계정코드","더존코드","계정과목","프로젝트","거래처","사업자번호","적요","차변","대변"]];
  periodVouchers().slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); })
    .forEach(function(v){
      (v.lines||[]).forEach(function(l){
        out.push([v.date, v.type, l.code, String(l.code||"").slice(0,3), l.name||accName(l.code),
                  l.project||"", l.partner||"", l.bizno||"", l.memo||v.memo||"",
                  (+l.dr||0)||"", (+l.cr||0)||""]);
      });
    });
  return out;
}
function rowsDouzone(){

  periodVouchers().slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); })
    .forEach(function(v){

/* --- 최소 XLSX (무압축 ZIP) --- */
var CRCT=(function(){ var t=new Int32Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = c&1 ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c; }
  return t; })();
function crc32(u8){ var c=-1; for(var i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ -1)>>>0; }
function enc(s){ return new TextEncoder().encode(s); }
function zipStore(files){
  var parts=[], central=[], off=0;
  files.forEach(function(f){
    var nb=enc(f.name), d=f.data, crc=crc32(d);
    var lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,d.length,true); dv.setUint32(22,d.length,true);
    dv.setUint16(26,nb.length,true); dv.setUint16(28,0,true);
    lh.set(nb,30);
    parts.push(lh); parts.push(d);
    var ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,d.length,true); cv.setUint32(24,d.length,true);
    cv.setUint16(28,nb.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,off,true);
    ch.set(nb,46); central.push(ch);
    off += lh.length + d.length;
  });
  var cs=central.reduce(function(s,c){ return s+c.length; },0);
  var eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cs,true); ev.setUint32(16,off,true); ev.setUint16(20,0,true);
  var all=parts.concat(central, [eo]);
  var total=all.reduce(function(s,p){ return s+p.length; },0);
  var out=new Uint8Array(total), pos=0;
  all.forEach(function(p){ out.set(p,pos); pos+=p.length; });
  return out;
}
function colName(n){ var s=""; while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function sheetXml(rows){
  var x='<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach(function(r, ri){
    x+='<row r="'+(ri+1)+'">';
    r.forEach(function(c, ci){
      if(c===null || c===undefined || c==="") return;
      var ref=colName(ci+1)+(ri+1);
      if(typeof c==="number" && isFinite(c)) x+='<c r="'+ref+'"><v>'+c+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+esc(c)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function buildXlsx(sheets){
  var files=[];
  var ct='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  sheets.forEach(function(s,i){ ct+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; });
  ct+='</Types>';
  files.push({name:"[Content_Types].xml", data:enc(ct)});
  files.push({name:"_rels/.rels", data:enc('<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  var wb='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach(function(s,i){ wb+='<sheet name="'+esc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; });
  wb+='</sheets></workbook>';
  files.push({name:"xl/workbook.xml", data:enc(wb)});
  var rel='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach(function(s,i){ rel+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; });
  rel+='</Relationships>';
  files.push({name:"xl/_rels/workbook.xml.rels", data:enc(rel)});
  sheets.forEach(function(s,i){ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:enc(sheetXml(s.rows))}); });
  return zipStore(files);
}

/* ---------- 저장소 · 이 브라우저 ---------- */
var LSKEY = "gongan-ledger-v1";
function embeddedSeed(){
  try{
    var n = document.getElementById("embedded-data");
    return n ? JSON.parse(n.textContent) : null;
  }catch(e){ return null; }
}
function applySeed(seed){
  if(seed.company) S.co = Object.assign(S.co, seed.company);
  S.accounts = (Array.isArray(seed.accounts) && seed.accounts.length)
    ? seed.accounts.slice() : DEFAULT_ACCOUNTS.slice();
  S.partners = Array.isArray(seed.partners) ? seed.partners.slice() : [];
  S.projects = Array.isArray(seed.projects) ? seed.projects.slice() : [];
  S.recon = (seed.recon && typeof seed.recon==="object") ? seed.recon : {};
  S.vat = (seed.vat && typeof seed.vat==="object") ? seed.vat : {};
  S.closes = (seed.closes && typeof seed.closes==="object") ? seed.closes : {};
  S.closeLog = Array.isArray(seed.closeLog) ? seed.closeLog : [];
  splitVouchers((Array.isArray(seed.vouchers)?seed.vouchers:[]).concat(Array.isArray(seed.trash)?seed.trash:[]));
  S.accounts.sort(function(a,b){ return String(a.code).localeCompare(String(b.code)); });
  S.partners.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"ko"); });
  S.seedStamp = seed.exportedAt || "";
  S.firstRun = false;
  S.dbState = "이 브라우저에 저장됨";
}
function saveAll(){
  try{
    localStorage.setItem(LSKEY, JSON.stringify({
      app:"gongan-ledger", version:1, company:S.co, accounts:S.accounts,
      partners:S.partners, projects:S.projects, vouchers:S.vouchers, trash:S.trash,
      recon:S.recon||{}, vat:S.vat||{}, closes:S.closes||{}, closeLog:S.closeLog||[],
      seedStamp:S.seedStamp||"",
      savedAt:new Date().toISOString()
    }));
    S.dbState="이 브라우저에 저장됨";
  }catch(e){
    S.dbState="저장하지 못했습니다";
    toast("저장 공간이 가득 찼거나 저장이 막혀 있습니다");
  }
  renderStatus();
}
function loadAll(){
  var raw=null, seed=embeddedSeed();
  try{ raw=localStorage.getItem(LSKEY); }catch(e){ raw=null; }

  if(!raw){
    if(seed && Array.isArray(seed.vouchers)){ applySeed(seed); saveAll(); return; }
    S.accounts=DEFAULT_ACCOUNTS.slice(); S.vouchers=[]; S.trash=[]; S.partners=[]; S.projects=[]; S.recon={}; S.vat={}; S.closes={}; S.closeLog=[]; S.firstRun=true;
    S.dbState="새 장부 · 기본 계정과목 "+S.accounts.length+"개";
    return;
  }
  try{
    var d=JSON.parse(raw);
    if(d.company) S.co=Object.assign(S.co, d.company);
    S.accounts=(Array.isArray(d.accounts)&&d.accounts.length)?d.accounts.slice():DEFAULT_ACCOUNTS.slice();
    S.partners=Array.isArray(d.partners)?d.partners.slice():[];
    S.projects=Array.isArray(d.projects)?d.projects.slice():[];
    splitVouchers((Array.isArray(d.vouchers)?d.vouchers:[]).concat(Array.isArray(d.trash)?d.trash:[]));
    S.recon=(d.recon && typeof d.recon==="object")?d.recon:{};
    S.vat=(d.vat && typeof d.vat==="object")?d.vat:{};
    S.closes=(d.closes && typeof d.closes==="object")?d.closes:{};
    S.closeLog=Array.isArray(d.closeLog)?d.closeLog:[];
    S.seedStamp=d.seedStamp||"";
    S.dbState="이 브라우저에 저장됨";
  }catch(e){
    S.accounts=DEFAULT_ACCOUNTS.slice(); S.vouchers=[]; S.trash=[]; S.partners=[]; S.projects=[]; S.recon={}; S.vat={}; S.closes={}; S.closeLog=[];
    S.dbState="저장된 자료를 읽지 못했습니다";
  }
  S.accounts.sort(function(a,b){ return String(a.code).localeCompare(String(b.code)); });
  S.partners.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"ko"); });

  /* 이 파일에 더 새로운 자료가 들어 있는지 */
  if(seed && seed.exportedAt && Array.isArray(seed.vouchers) && seed.exportedAt !== S.seedStamp){
    S.seedUpdate = { stamp:seed.exportedAt, n:seed.vouchers.length, cur:S.vouchers.length, data:seed };
  }
}
function takeSeedUpdate(){
  var u=S.seedUpdate; if(!u) return;
  var msg = "이 파일에 더 새로운 자료가 들어 있습니다." + "\n\n" + "지금 장부: 전표 " + u.cur + "장" + "\n" + "파일 자료: 전표 " + u.n + "장" + "\n\n" + "바꾸기 전에 지금 장부를 백업 파일로 먼저 받아 두겠습니다. 진행할까요?";
  if(!confirm(msg)) return;
  try{ saveFile("장부백업_바꾸기전_"+new Date().toISOString().slice(0,10)+".json", backupJson()); }catch(e){}
  applySeed(u.data); S.seedUpdate=null; saveAll();
  toast("파일에 든 자료로 바꿨습니다 · 전표 "+S.vouchers.length+"장");
  render();
}
function keepMine(){
  var u=S.seedUpdate; if(!u) return;
  S.seedStamp=u.stamp; S.seedUpdate=null; saveAll();
  toast("지금 장부를 그대로 씁니다");
  render();
}
function persistProjects(){
  S.projects.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"ko"); });
  saveAll();
}
function persistPartners(){
  S.partners.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"ko"); });
  saveAll();
}
function persistAccounts(){ saveAll(); }
function persistRecon(){ saveAll(); }
function persistVat(){ saveAll(); }
function persistCloses(){ saveAll(); }
function persistVoucher(id, doc){
  putLocal(id, doc);
  S.firstRun=false; saveAll();
}
function backupJson(){
  return JSON.stringify({
    app:"gongan-ledger", version:1, exportedAt:new Date().toISOString(),
    company:S.co, accounts:S.accounts, partners:S.partners, projects:S.projects,
    recon:S.recon||{}, vat:S.vat||{}, closes:S.closes||{}, closeLog:S.closeLog||[],
    vouchers:S.vouchers, trash:S.trash
  }, null, 1);
}
function restoreJson(text){
  var d;
  try{ d=JSON.parse(text); }catch(e){ toast("JSON 파일이 아닙니다"); return; }
  if(!d || d.app!=="gongan-ledger" || !Array.isArray(d.vouchers)){
    toast("이 앱에서 만든 백업 파일이 아닙니다"); return;
  }
  if(d.company) S.co=Object.assign(S.co, d.company);
  var have={}; S.accounts.forEach(function(a){ have[a.code]=1; });
  (d.accounts||[]).forEach(function(a){ if(a && a.code && !have[a.code]) S.accounts.push(a); });
  S.accounts.sort(function(a,b){ return String(a.code).localeCompare(String(b.code)); });
  var ph={}; S.partners.forEach(function(p){ ph[p.name]=1; });
  (d.partners||[]).forEach(function(p){ if(p && p.name && !ph[p.name]) S.partners.push(p); });
  var jh={}; S.projects.forEach(function(p){ jh[p.name]=1; });
  (d.projects||[]).forEach(function(p){ if(p && p.name && !jh[p.name]) S.projects.push(p); });
  if(d.closes && typeof d.closes==="object"){
    if(!S.closes) S.closes={};
    Object.keys(d.closes).forEach(function(m){ if(!S.closes[m]) S.closes[m]=d.closes[m]; });
  }
  if(Array.isArray(d.closeLog) && d.closeLog.length){
    if(!S.closeLog) S.closeLog=[];
    var seen={};
    S.closeLog.forEach(function(x){ seen[x.m+"|"+x.act+"|"+x.at]=1; });
    d.closeLog.forEach(function(x){ if(!seen[x.m+"|"+x.act+"|"+x.at]) S.closeLog.push(x); });
  }
  if(d.recon && typeof d.recon==="object"){
    if(!S.recon) S.recon={};
    Object.keys(d.recon).forEach(function(code){
      var src=d.recon[code]||{}, dst=S.recon[code]||(S.recon[code]={cleared:{}, balances:{}});
      if(!dst.cleared) dst.cleared={};
      if(!dst.balances) dst.balances={};
      Object.keys(src.cleared||{}).forEach(function(k){ dst.cleared[k]=src.cleared[k]; });
      Object.keys(src.balances||{}).forEach(function(k){ if(dst.balances[k]===undefined) dst.balances[k]=src.balances[k]; });
    });
  }
  var here={}; allVouchers().forEach(function(v){ here[v.id]=1; });
  var added=0;
  (d.vouchers||[]).concat(d.trash||[]).forEach(function(v){
    if(v && v.id && !here[v.id]){ (v.deleted ? S.trash : S.vouchers).push(v); added++; }
  });
  sortTrash();
  S.firstRun=false; saveAll();
  toast("되살렸습니다 · 전표 "+added+"장 추가"); render();
}
function pickBackup(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json"; inp.style.display="none";
  inp.addEventListener("change", function(){
    var fl=inp.files && inp.files[0]; if(!fl) return;
    var r=new FileReader();
    r.onload=function(){ restoreJson(String(r.result)); inp.remove(); };
    r.onerror=function(){ toast("파일을 읽지 못했습니다"); inp.remove(); };
    r.readAsText(fl, "utf-8");
  });
  document.body.appendChild(inp); inp.click();
}

/* ---------- 렌더 ---------- */
function renderView(){
  var v=$("#view"); v.innerHTML="";
  var titles={entry:"전표 입력", ledger:"전표장", pivot:"집계표", fs:"재무제표", recon:"대사", projects:"프로젝트", partners:"거래처", accounts:"계정과목", export:"내보내기"};
  var subs={
    entry:"대차가 맞을 때만 저장됩니다 · 저장 후에는 역분개로만 바로잡습니다",
    ledger:"삭제해도 기록은 지워지지 않습니다 · 「삭제이력」에서 되살릴 수 있습니다",
    pivot:"계정별 합계와, 계정마다 거래처별로 갈라 놓은 잔액입니다",
    fs:"집계표에서 자동으로 만들어집니다 · 재무상태표는 원하는 시점을 고르실 수 있습니다",
    recon:"통장·홈택스 자료와 장부를 맞춰 봅니다 · 전표는 건드리지 않습니다",
    projects:"전표 줄마다 프로젝트를 달면 여기서 프로젝트별로 얼마인지 보입니다",
    partners:"등록해 두면 전표에서 이름만 골라도 사업자번호가 따라옵니다",
    accounts:"코드 앞 3자리가 더존 표준코드입니다",
    export:"엑셀·CSV·더존 형식으로 받으실 수 있습니다"
  };
  $("#vTitle").textContent = titles[S.view] || "";
  $("#vSub").textContent = subs[S.view] || "";
  var acts=$("#vActions"); acts.innerHTML="";
  if(S.view!=="entry"){
    var nb=el("button",{class:"btn pri", html:svg("M10 5v10M5 10h10",14)+"<span>전표 쓰기</span>"});
    nb.addEventListener("click", function(){
      if(S.editId && !confirm("고치던 전표가 있습니다. 수정을 취소하고 새 전표를 쓰시겠습니까?")) return;
      S.editId=null; S.draft=newDraft(); S.view="entry"; render();
    });
    acts.appendChild(nb);
  }
  var g=globalBalance();
  if(S.vouchers.length){
    acts.appendChild(el("span",{class:"tag "+(Math.abs(g.diff)<0.5?"g":"c"),
      text: Math.abs(g.diff)<0.5 ? "전체 대차 일치" : "전체 차액 "+fmt0(g.diff)}));
  }
  if(S.seedUpdate){
    var sb=el("div",{class:"banner w"});
    sb.innerHTML = svg("M10 6.5v4.2M10 13.6h.01",17)
      + "<span><b>이 파일에 더 새로운 자료가 들어 있습니다.</b> "
      + "지금 장부는 전표 " + S.seedUpdate.cur + "장, 파일 자료는 " + S.seedUpdate.n + "장입니다. "
      + "바꾸시면 지금 장부는 먼저 백업 파일로 받아 둡니다.</span>";
    var wrapb=el("span",{style:"margin-left:auto;display:flex;gap:7px;flex:none;"});
    var b1=el("button",{class:"btn sm pri", text:"파일 자료로 바꾸기"});
    b1.addEventListener("click", takeSeedUpdate);
    var b2=el("button",{class:"btn sm", text:"그대로 두기"});
    b2.addEventListener("click", keepMine);
    wrapb.appendChild(b1); wrapb.appendChild(b2); sb.appendChild(wrapb);
    v.appendChild(sb);
  }
  var node;
  if(S.view==="entry") node=viewEntry();
  else if(S.view==="ledger") node=viewLedger();
  else if(S.view==="pivot") node=viewPivot();
  else if(S.view==="fs") node=viewFS();
  else if(S.view==="recon") node=viewRecon();
  else if(S.view==="projects") node=viewProjects();
  else if(S.view==="partners") node=viewPartners();
  else if(S.view==="accounts") node=viewAccounts();
  else node=viewExport();
  v.appendChild(node);
}
function render(){
  $("#coName").textContent = S.co.name + (S.co.fyLabel ? " · "+S.co.fyLabel : "");
  renderPeriod(); renderNav(); renderStatus(); renderView();
}

loadAll();
render();
if(window.claude && typeof claude.use === "function"){
  try{ claude.use("downloads").then(function(x){ DL=x; }, function(){}); }catch(e){}
}
window.addEventListener("storage", function(e){ if(e.key===LSKEY){ loadAll(); render(); } });
})();
