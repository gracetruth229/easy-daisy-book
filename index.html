<title>공간 회계장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --surface-2:#EBEFEA; --surface-3:#FBFCFA;
  --ink:#16211C; --ink-2:#4A554F; --ink-3:#7B857F; --ink-4:#A9B2AC;
  --rule:#D8DFD7; --rule-soft:#EAEEE8;
  --accent:#1D6C58; --accent-deep:#155245; --on-accent:#FFFFFF; --accent-soft:#E1EEE9;
  --dr:#2A5FA5; --dr-soft:#E5EDF7;
  --cr:#A8462E; --cr-soft:#F7E9E4;
  --warn:#8A5A12; --warn-soft:#F8EFDC;
  --crit:#A93529; --crit-soft:#F9E6E3;
  --f-d:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-b:"IBM Plex Sans KR",-apple-system,"Malgun Gothic",sans-serif;
  --f-m:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1512; --surface:#161E1A; --surface-2:#1D2722; --surface-3:#131A16;
  --ink:#E6EBE6; --ink-2:#A6B1AA; --ink-3:#7D8781; --ink-4:#5E6862;
  --rule:#2A352F; --rule-soft:#212B26;
  --accent:#5CBFA0; --accent-deep:#8AD6BC; --on-accent:#0F1512; --accent-soft:#17302A;
  --dr:#84B0E5; --dr-soft:#182432;
  --cr:#E1997F; --cr-soft:#2E1E19;
  --warn:#D9A44E; --warn-soft:#2C2415;
  --crit:#E47766; --crit-soft:#311D1A;
}}
:root[data-theme="dark"]{
  --paper:#0F1512; --surface:#161E1A; --surface-2:#1D2722; --surface-3:#131A16;
  --ink:#E6EBE6; --ink-2:#A6B1AA; --ink-3:#7D8781; --ink-4:#5E6862;
  --rule:#2A352F; --rule-soft:#212B26;
  --accent:#5CBFA0; --accent-deep:#8AD6BC; --on-accent:#0F1512; --accent-soft:#17302A;
  --dr:#84B0E5; --dr-soft:#182432;
  --cr:#E1997F; --cr-soft:#2E1E19;
  --warn:#D9A44E; --warn-soft:#2C2415;
  --crit:#E47766; --crit-soft:#311D1A;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.m{font-family:var(--f-m);font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:0 9px;height:32px;min-width:0;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
input[type=number]{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

/* shell */
#app{display:flex;height:100vh;min-height:560px;}
.side{width:214px;flex:none;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:18px 0 12px;}
.wm{font-family:var(--f-d);font-weight:700;font-size:18px;padding:0 18px 3px;letter-spacing:-.01em;}
.co{padding:0 18px 14px;font-size:12px;color:var(--ink-3);}
.per{margin:0 12px 14px;}
.per label{display:block;font-size:10.5px;font-family:var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.per select{width:100%;}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px;}
.nav button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;border-radius:6px;background:none;font-size:13.5px;color:var(--ink-2);font-weight:500;text-align:left;cursor:pointer;width:100%;}
.nav button:hover{background:var(--surface-2);}
.nav button.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600;}
.nav svg{flex:none;opacity:.75;}
.nav button.on svg{opacity:1;}
.nav .ct{margin-left:auto;font-family:var(--f-m);font-size:10.5px;color:var(--ink-3);}
.sfoot{margin-top:auto;padding:12px 18px 0;border-top:1px solid var(--rule-soft);font-size:11px;color:var(--ink-3);line-height:1.5;}
.sfoot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-4);margin-right:5px;vertical-align:1px;}
.sfoot .dot.ok{background:var(--accent);}
.sfoot .dot.bad{background:var(--crit);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.tb{flex:none;min-height:56px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 22px;flex-wrap:wrap;}
.tb h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.tb .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.tbr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.body{flex:1;overflow:auto;padding:18px 22px 40px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.pri:hover{filter:brightness(1.08);}
.btn.pri:disabled{opacity:.42;cursor:not-allowed;filter:none;}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;}
.btn.danger{color:var(--crit);border-color:var(--rule);}
.btn.danger:hover{background:var(--crit-soft);}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;}
.seg button{height:30px;padding:0 11px;border:0;background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}
.seg button+button{border-left:1px solid var(--rule);}
.seg button.on{background:var(--accent);color:var(--on-accent);}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px;overflow:hidden;}
.card+.card{margin-top:16px;}
.ch{padding:10px 15px;border-bottom:1px solid var(--rule);background:var(--surface-3);font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.ch .r{display:flex;align-items:center;gap:8px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:var(--f-m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--surface-3);white-space:nowrap;position:sticky;top:0;z-index:1;}
td{padding:7px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
td.n,th.n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap;}
td.c{font-family:var(--f-m);font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
td.dr{color:var(--dr);font-weight:500;}
td.cr{color:var(--cr);font-weight:500;}
td.mut{color:var(--ink-3);}
.tw{overflow-x:auto;}
.zero{color:var(--ink-4);}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:0 7px;border-radius:4px;line-height:18px;white-space:nowrap;}
.tag.b{background:var(--surface-2);color:var(--ink-3);}
.tag.g{background:var(--accent-soft);color:var(--accent-deep);}
.tag.w{background:var(--warn-soft);color:var(--warn);}
.tag.c{background:var(--crit-soft);color:var(--crit);}
.tag.d{background:var(--dr-soft);color:var(--dr);}

/* entry */
.grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px;padding:14px 15px;}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;}
.f label{font-size:10.5px;color:var(--ink-3);font-weight:500;}
.f.s2{grid-column:span 2;} .f.s3{grid-column:span 3;} .f.s4{grid-column:span 4;}
.f.s5{grid-column:span 5;} .f.s6{grid-column:span 6;} .f.s12{grid-column:span 12;}
table.lines td{padding:5px 8px;}
table.lines th{padding:7px 8px;}
table.lines input,table.lines select{height:30px;width:100%;font-size:12.5px;}
table.lines td.act{width:34px;text-align:center;padding:5px 4px;}
.xbtn{width:24px;height:24px;border-radius:5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-3);cursor:pointer;display:inline-grid;place-items:center;}
.xbtn:hover{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-soft);}
.sumbar{display:flex;align-items:center;gap:16px;padding:11px 15px;border-top:1px solid var(--rule);background:var(--surface-3);flex-wrap:wrap;}
.sumbar .lb{font-size:11.5px;color:var(--ink-3);}
.sumbar .vl{font-family:var(--f-m);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;}
.sumbar .diff.ok{color:var(--accent-deep);}
.sumbar .diff.bad{color:var(--crit);}
.sumbar .sp{flex:1;}

/* fs */
.fs2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
table.fs td{padding:5px 14px;border-bottom:1px solid var(--rule-soft);}
table.fs tr.grp td{background:var(--surface-3);font-weight:600;color:var(--ink-2);font-size:11.5px;padding:7px 14px;border-top:1px solid var(--rule-soft);}
table.fs tr.hd td{font-weight:600;}
table.fs tr.sub td:first-child{padding-left:30px;color:var(--ink-2);}
table.fs tr.tot td{border-top:1px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--surface-3);font-weight:600;padding-top:8px;padding-bottom:8px;}
table.fs td.n{width:140px;}
.neg{color:var(--cr);}
.chkbar{padding:10px 15px;border-top:1px solid var(--rule);background:var(--surface-3);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
.chkbar.ok{color:var(--accent-deep);}
.chkbar.bad{color:var(--crit);}
.chkbar .sp{flex:1;}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.7;}
.empty b{display:block;color:var(--ink-2);font-size:15px;font-weight:600;margin-bottom:5px;}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6;padding:11px 15px;border-top:1px solid var(--rule-soft);}
.banner{margin-bottom:16px;border-radius:8px;padding:12px 15px;font-size:13px;display:flex;gap:10px;align-items:flex-start;line-height:1.55;}
.banner.w{background:var(--warn-soft);color:var(--warn);}
.banner.c{background:var(--crit-soft);color:var(--crit);}
.banner b{font-weight:600;}
.banner svg{flex:none;margin-top:2px;}

.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:15px;}
.xc{border:1px solid var(--rule);border-radius:8px;padding:15px 16px;background:var(--surface);display:flex;flex-direction:column;gap:5px;}
.xc b{font-size:14px;font-weight:600;}
.xc span{font-size:12px;color:var(--ink-3);line-height:1.55;flex:1;}
.xc .btn{margin-top:9px;align-self:flex-start;}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 8px 26px -8px rgba(0,0,0,.45);z-index:99;opacity:0;pointer-events:none;transition:opacity .18s;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}

@media (max-width:900px){
  #app{flex-direction:column;height:auto;min-height:100vh;}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--rule);padding:12px 0 8px;}
  .wm,.co{padding-left:16px;padding-right:16px;}
  .nav{flex-direction:row;overflow-x:auto;padding:0 10px;}
  .nav button{white-space:nowrap;}
  .nav .ct{display:none;}
  .per{margin:10px 12px;}
  .sfoot{padding-top:10px;}
  .fs2{grid-template-columns:1fr;}
  .body{padding:14px 14px 40px;}
  .grid2 .f.s2,.grid2 .f.s3,.grid2 .f.s4{grid-column:span 6;}
}
</style>

<div id="app">
  <aside class="side">
    <div class="wm">공간 회계장부</div>
    <div class="co" id="coName">회사 불러오는 중…</div>
    <div class="per">
      <label for="periodSel">기간</label>
      <select id="periodSel"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot" id="status"><span class="dot"></span>저장소 연결 중…</div>
  </aside>

  <main class="main">
    <header class="tb">
      <div><h1 id="vTitle">전표 입력</h1><div class="sub" id="vSub"></div></div>
      <div class="tbr" id="vActions"></div>
    </header>
    <div class="body" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

  for(var i=0;i<CATS.length;i++){ if(c>=CATS[i].lo && c<=CATS[i].hi) return CATS[i]; }
  return {k:"A",name:"기타",dn:true};

/* 기간 필터 */
function inPeriod(v){ return S.period==="all" || ym(v.date)===S.period; }
function upToPeriod(v){ return S.period==="all" || ym(v.date)<=S.period; }
function periodVouchers(){ return S.vouchers.filter(inPeriod); }
function months(){
  var set={}; S.vouchers.forEach(function(v){ if(v.date) set[ym(v.date)]=1; });
  return Object.keys(set).sort();
}

/* 계정별 집계 */
function tally(filter){
  var m={};
  S.vouchers.filter(filter).forEach(function(v){
    (v.lines||[]).forEach(function(l){
      if(!l.code) return;
      if(!m[l.code]) m[l.code]={code:l.code, dr:0, cr:0};
      m[l.code].dr += (+l.dr||0); m[l.code].cr += (+l.cr||0);
    });
  });
  return m;
}
function balOf(row){
  var c=catOf(row.code);
  return c.dn ? (row.dr-row.cr) : (row.cr-row.dr);
}
/* 손익: 누계/당월 */
function plTally(){ return tally(S.plMode==="cum" ? upToPeriod : inPeriod); }
function sumRange(m, lo, hi){
  var t=0; for(var k in m){ var c=parseInt(k,10); if(c>=lo && c<=hi) t+=balOf(m[k]); } return t;
}
function netIncome(m){
  return sumRange(m,4000000,4499999) - sumRange(m,4500000,4999999)
       - sumRange(m,8000000,8999999)
       + sumRange(m,9000000,9309999) - sumRange(m,9310000,9999999);
}

function buildBS(){
  var m=tally(upToPeriod), rows=[], tA=0, tL=0, tE=0;
  BSG.forEach(function(g){
    var items=S.accounts.filter(function(a){
      var c=parseInt(a.code,10); return c>=g.lo && c<=g.hi;
    }).map(function(a){
      return {code:a.code, name:a.name, bal: m[a.code] ? balOf(m[a.code]) : 0};
    });
    var sum=items.reduce(function(s,i){ return s+i.bal; },0);
    if(g.side==="A") tA+=sum; else if(g.side==="L") tL+=sum; else tE+=sum;
    rows.push({grp:g.t, side:g.side, sum:sum, items:items});
  });
  var ni=netIncome(tally(upToPeriod));
  tE += ni;
  return {rows:rows, tA:tA, tL:tL, tE:tE, ni:ni, diff:tA-(tL+tE)};
}
function buildPL(){
  var m=plTally();
  var sales=sumRange(m,4000000,4499999), cogs=sumRange(m,4500000,4999999);
  var gross=sales-cogs;
  var sga=sumRange(m,8000000,8999999);
  var op=gross-sga;
  var ni_=sumRange(m,9000000,9309999), ne=sumRange(m,9310000,9999999);
  var pre=op+ni_-ne;
  function items(lo,hi){
    return S.accounts.filter(function(a){ var c=parseInt(a.code,10); return c>=lo&&c<=hi; })
      .map(function(a){ return {code:a.code, name:a.name, bal: m[a.code]?balOf(m[a.code]):0}; });
  }
  return {sales:sales, cogs:cogs, gross:gross, sga:sga, op:op, ni:ni_, ne:ne, pre:pre, net:pre,
    iSales:items(4000000,4499999), iCogs:items(4500000,4999999), iSga:items(8000000,8999999),
    iNi:items(9000000,9309999), iNe:items(9310000,9999999)};
}

/* --- 최소 XLSX (무압축 ZIP) --- */
var CRCT=(function(){ var t=new Int32Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = c&1 ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c; }
  return t; })();

function enc(s){ return new TextEncoder().encode(s); }
function zipStore(files){
  var parts=[], central=[], off=0;
  files.forEach(function(f){
    var nb=enc(f.name), d=f.data, crc=crc32(d);
    var lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,d.length,true); dv.setUint32(22,d.length,true);
    dv.setUint16(26,nb.length,true); dv.setUint16(28,0,true);
    lh.set(nb,30);
    parts.push(lh); parts.push(d);
    var ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,d.length,true); cv.setUint32(24,d.length,true);
    cv.setUint16(28,nb.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,off,true);
    ch.set(nb,46); central.push(ch);
    off += lh.length + d.length;
  });
  var cs=central.reduce(function(s,c){ return s+c.length; },0);
  var eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cs,true); ev.setUint32(16,off,true); ev.setUint16(20,0,true);
  var all=parts.concat(central, [eo]);
  var total=all.reduce(function(s,p){ return s+p.length; },0);
  var out=new Uint8Array(total), pos=0;
  all.forEach(function(p){ out.set(p,pos); pos+=p.length; });
  return out;
}
function colName(n){ var s=""; while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function sheetXml(rows){
  var x='<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach(function(r, ri){
    x+='<row r="'+(ri+1)+'">';
    r.forEach(function(c, ci){
      if(c===null || c===undefined || c==="") return;
      var ref=colName(ci+1)+(ri+1);
      if(typeof c==="number" && isFinite(c)) x+='<c r="'+ref+'"><v>'+c+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+esc(c)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function buildXlsx(sheets){
  var files=[];
  var ct='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  sheets.forEach(function(s,i){ ct+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; });
  ct+='</Types>';
  files.push({name:"[Content_Types].xml", data:enc(ct)});
  files.push({name:"_rels/.rels", data:enc('<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  var wb='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach(function(s,i){ wb+='<sheet name="'+esc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; });
  wb+='</sheets></workbook>';
  files.push({name:"xl/workbook.xml", data:enc(wb)});
  var rel='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach(function(s,i){ rel+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; });
  rel+='</Relationships>';
  files.push({name:"xl/_rels/workbook.xml.rels", data:enc(rel)});
  sheets.forEach(function(s,i){ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:enc(sheetXml(s.rows))}); });
  return zipStore(files);
}
var DL=null;
async function saveFile(filename, data){
  if(DL){
    try{ await DL.save({filename:filename, data:data}); toast("저장했습니다 · "+filename); return; }
    catch(e){ if((e&&e.code)==="declined") return; }
  }
  try{
    var blob = (data instanceof Blob) ? data : new Blob([data], {type:"application/octet-stream"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast("내려받았습니다 · "+filename);
  }catch(e){ toast("내려받지 못했습니다"); }
}

/* ---------- 저장소 · 이 브라우저 (localStorage) ---------- */
var LSKEY = "gongan-ledger-v1";
function saveAll(){
  try{
    localStorage.setItem(LSKEY, JSON.stringify({
      app:"gongan-ledger", version:1, company:S.co,
      accounts:S.accounts, vouchers:S.vouchers, savedAt:new Date().toISOString()
    }));
    S.dbState="이 브라우저에 저장됨";
  }catch(e){
    S.dbState="저장하지 못했습니다";
    toast("저장 공간이 가득 찼거나 저장이 막혀 있습니다");
  }
  renderStatus();
}
function loadAll(){
  var raw=null;
  try{ raw=localStorage.getItem(LSKEY); }catch(e){ raw=null; }
  if(!raw){
    S.accounts=DEFAULT_ACCOUNTS.slice(); S.vouchers=[]; S.firstRun=true;
    S.dbState="새 장부 · 기본 계정과목 "+S.accounts.length+"개";
    return;
  }
  try{
    var d=JSON.parse(raw);
    if(d.company) S.co=Object.assign(S.co, d.company);
    S.accounts=(Array.isArray(d.accounts)&&d.accounts.length)?d.accounts.slice():DEFAULT_ACCOUNTS.slice();
    S.vouchers=Array.isArray(d.vouchers)?d.vouchers.slice():[];
    S.dbState="이 브라우저에 저장됨";
  }catch(e){
    S.accounts=DEFAULT_ACCOUNTS.slice(); S.vouchers=[];
    S.dbState="저장된 자료를 읽지 못했습니다";
  }
  S.accounts.sort(function(a,b){ return String(a.code).localeCompare(String(b.code)); });
}
function persistAccounts(){ saveAll(); }
function persistVoucher(id, doc){
  var i=-1; S.vouchers.forEach(function(v,k){ if(v.id===id) i=k; });
  var local=Object.assign({id:id}, doc);
  if(i>=0) S.vouchers[i]=local; else S.vouchers.push(local);
  S.firstRun=false; saveAll();
}
function removeVoucher(id){
  S.vouchers=S.vouchers.filter(function(v){ return v.id!==id; });
  saveAll(); toast("전표를 지웠습니다"); render();
}
function backupJson(){
  return JSON.stringify({
    app:"gongan-ledger", version:1, exportedAt:new Date().toISOString(),
    company:S.co, accounts:S.accounts, vouchers:S.vouchers
  }, null, 1);
}
function importJson(text, mode){
  var d;
  try{ d=JSON.parse(text); }catch(e){ toast("JSON 파일이 아닙니다"); return; }
  if(!d || d.app!=="gongan-ledger" || !Array.isArray(d.vouchers)){
    toast("이 앱에서 만든 백업 파일이 아닙니다"); return;
  }
  if(d.company) S.co=Object.assign(S.co, d.company);
  if(Array.isArray(d.accounts) && d.accounts.length){
    if(mode==="merge"){
      var have={}; S.accounts.forEach(function(a){ have[a.code]=1; });
      d.accounts.forEach(function(a){ if(!have[a.code]) S.accounts.push(a); });
    } else { S.accounts=d.accounts.slice(); }
    S.accounts.sort(function(a,b){ return String(a.code).localeCompare(String(b.code)); });
  }
  if(mode==="merge"){
    var byId={}; S.vouchers.forEach(function(v){ byId[v.id]=1; });
    var added=0;
    d.vouchers.forEach(function(v){ if(v.id && !byId[v.id]){ S.vouchers.push(v); added++; } });
    toast("합쳤습니다 · 전표 "+added+"장 추가");
  } else {
    S.vouchers=d.vouchers.slice();
    toast("가져왔습니다 · 전표 "+d.vouchers.length+"장");
  }
  S.firstRun=false; saveAll(); render();
}
function pickFile(mode){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json"; inp.style.display="none";
  inp.addEventListener("change", function(){
    var f=inp.files && inp.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ importJson(String(r.result), mode); inp.remove(); };
    r.onerror=function(){ toast("파일을 읽지 못했습니다"); inp.remove(); };
    r.readAsText(f, "utf-8");
  });
  document.body.appendChild(inp); inp.click();
}
function wipeAll(){
  if(!confirm("이 브라우저에 저장된 장부를 모두 지웁니다.

먼저 백업을 받아 두셨나요? 되돌릴 수 없습니다.")) return;
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  S.accounts=DEFAULT_ACCOUNTS.slice(); S.vouchers=[]; S.firstRun=true; S.period="all";
  S.dbState="새 장부 · 기본 계정과목 "+S.accounts.length+"개";
  toast("장부를 비웠습니다"); render();
}

/* ---------- 렌더 ---------- */
function renderView(){
  var v=$("#view"); v.innerHTML="";
  var titles={entry:"전표 입력", ledger:"전표장", pivot:"집계표", fs:"재무제표", accounts:"계정과목", export:"내보내기"};
  var subs={
    entry:"거래를 줄로 적으면 대차가 맞을 때만 저장됩니다",
    ledger:"저장된 전표를 전표 단위로 묶어 보여줍니다",
    pivot:"계정별 차변·대변 합계와 잔액입니다",
    fs:"집계표에서 자동으로 만들어집니다",
    accounts:"코드 앞 3자리가 더존 표준코드입니다",
    export:"엑셀·CSV·더존 형식으로 받으실 수 있습니다"
  };
  $("#vTitle").textContent = titles[S.view] || "";
  $("#vSub").textContent = subs[S.view] || "";
  var acts=$("#vActions"); acts.innerHTML="";
  if(S.view!=="entry"){
    var nb=el("button",{class:"btn pri", html:svg("M10 5v10M5 10h10",14)+"<span>전표 쓰기</span>"});
    nb.addEventListener("click", function(){ S.editId=null; S.draft=newDraft(); S.view="entry"; render(); });
    acts.appendChild(nb);
  }
  var g=globalBalance();
  if(S.vouchers.length){
    acts.appendChild(el("span",{class:"tag "+(Math.abs(g.diff)<0.5?"g":"c"),
      text: Math.abs(g.diff)<0.5 ? "전체 대차 일치" : "전체 차액 "+fmt0(g.diff)}));
  }
  var node;
  if(S.view==="entry") node=viewEntry();
  else if(S.view==="ledger") node=viewLedger();
  else if(S.view==="pivot") node=viewPivot();
  else if(S.view==="fs") node=viewFS();
  else if(S.view==="accounts") node=viewAccounts();
  else node=viewExport();
  v.appendChild(node);
}
function render(){
  $("#coName").textContent = S.co.name + (S.co.fyLabel ? " · "+S.co.fyLabel : "");
  renderPeriod(); renderNav(); renderStatus(); renderView();
}

loadAll();
render();
if(window.claude && typeof claude.use === "function"){
  try{ claude.use("downloads").then(function(d){ DL=d; }, function(){}); }catch(e){}
}
window.addEventListener("storage", function(e){
  if(e.key===LSKEY){ loadAll(); render(); }
});
})();
